# goreleaser config for macswitcher.
#
# macswitcher shells out to macOS-only binaries (networksetup, launchctl,
# etc.) at runtime, but the Go code itself has no cgo or build tags, so pure
# cross-compilation to darwin/amd64 and darwin/arm64 from any runner works.
# No macOS runner is required for the release job.
version: 2

builds:
  - id: macswitcher
    main: ./cmd/macswitcher
    binary: macswitcher
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0

archives:
  - id: macswitcher
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

sboms:
  - id: macswitcher
    artifacts: archive

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: schretzi
    name: macswitcher

# Casks, not formulas: `brews` was deprecated in goreleaser v2.16 in favour
# of `homebrew_casks`, which is the tool Homebrew expects for distributing
# pre-compiled binaries (and gets completions/manpages/post-install hooks
# that `brews` never had).
homebrew_casks:
  - name: macswitcher
    # Publishes to github.com/schretzi/homebrew-tap, so users can
    # `brew install schretzi/tap/macswitcher`. That repository must exist,
    # and the release workflow needs a HOMEBREW_TAP_TOKEN secret with write
    # access to it (the default GITHUB_TOKEN only covers this repo).
    repository:
      owner: schretzi
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/schretzi/macswitcher
    description: Manage macOS network contexts, DNS, and proxy services
    license: MIT

    binaries:
      - macswitcher

    commit_author:
      name: goreleaser
      email: noreply@github.com

    hooks:
      post:
        install: |
          if OS.mac?
            # The release binaries are not notarized, so Gatekeeper would
            # otherwise refuse to run them after a browser-less download.
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/macswitcher"]
          end

