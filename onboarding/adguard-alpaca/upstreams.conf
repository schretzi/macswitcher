# AdGuard Home upstreams file for the "AdGuard Home + Alpaca" minimal scenario.
#
# The first block (before the blank line) is the DEFAULT upstreams -
# macswitcher rewrites this block on every context switch, from that
# context's `upstreams:` list. Do not hand-edit it; edit contexts/home.yaml
# and contexts/office.yaml instead.
#
# Everything after the blank line is PER-DOMAIN and is never touched by
# macswitcher - carried over untouched on every switch. This is the right
# place for any hostname that must resolve the same way regardless of which
# context is active, most importantly your VPN gateway/forward-proxy
# hostname (see the main project README's "Preflight" section, and
# onboarding/README.md, for why: a name whose resolution depends on which
# context's default upstream happens to be active can end up depending on
# the very tunnel it's needed to bring up).
#
# Replace CHANGE-ME-vpn.corp.example.com below with your actual VPN
# gateway/forward-proxy hostname, or delete the line entirely if you don't
# have one yet (add it later - it costs two lines whenever it becomes
# relevant).

9.9.9.9
1.1.1.1

[/CHANGE-ME-vpn.corp.example.com/]9.9.9.9
[/CHANGE-ME-vpn.corp.example.com/]1.1.1.1
