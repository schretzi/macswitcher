# Unbound config for the "Unbound + Alpaca" minimal scenario.
#
# Installed by install.sh to /opt/homebrew/etc/unbound/unbound.conf (or
# /usr/local/etc/... on Intel). macswitcher rewrites ONLY the file included
# below (unbound.forwarders_file in config.yaml) - on every switch, with the
# active context's `upstreams` - and restarts unbound via
# applications.unbound.restart. This file itself is never touched by a
# switch: the two forward-zones below are permanent, deliberately outside
# macswitcher's reach.
#
# The VPN gateway/forward-proxy hostname zone in particular is the fix
# applied to macswitcher's own AdGuard Home setup after an outage: forwarding
# a name to whichever resolvers happen to be "the current context's" is what
# breaks when the network changes or a VPN drops - a static, per-domain
# forward-zone here resolves the same way regardless of which macswitcher
# context is active, or whether its upstreams have even been written yet.
#
# Replace every CHANGE-ME below with your employer's actual values.

server:
  # A dedicated loopback alias, not plain 127.0.0.1: mDNSResponder already
  # owns 127.0.0.1:53 on macOS. install.sh creates this alias with a
  # LaunchDaemon that re-applies it on every boot (macOS does not persist
  # extra lo0 aliases across reboots).
  interface: 127.0.0.2
  port: 53
  access-control: 127.0.0.0/8 allow
  do-ip6: no
  # Answers instantly from cache when the upstream is briefly unreachable
  # (a flaky Wi-Fi handoff, a VPN reconnect) instead of hanging every lookup.
  serve-expired: yes
  serve-expired-ttl: 86400
  cache-max-ttl: 86400

# Corporate-only names: always forwarded to the corporate resolvers,
# regardless of which network this Mac is physically on right now. Off the
# VPN/corporate network these simply fail to resolve, which is correct - they
# are not supposed to be reachable from anywhere else.
forward-zone:
  name: "CHANGE-ME-corp.example.com."
  forward-addr: CHANGE-ME-10.0.0.1
  forward-addr: CHANGE-ME-10.0.0.2

# The VPN gateway/forward-proxy hostname itself is the one name that MUST
# resolve from anywhere, including before the VPN tunnel exists - see the
# rationale above. Forward it to a public resolver explicitly, the same way
# the corporate zone above forwards to the corporate one, rather than letting
# it fall through to the default (below) and depend on whichever context's
# upstreams happen to be loaded right now.
forward-zone:
  name: "CHANGE-ME-vpn.corp.example.com."
  forward-addr: 9.9.9.9
  forward-addr: 1.1.1.1

# Everything else: macswitcher rewrites this file's forward-addr entries
# with the active context's `upstreams` on every switch (see config.yaml's
# unbound.forwarders_file). install.sh seeds it with public resolvers so
# unbound has something to include before the first switch ever runs.
include: /opt/homebrew/etc/unbound/conf.d/forwarders.conf

